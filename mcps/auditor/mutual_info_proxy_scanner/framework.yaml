algorithm_id: 5
name: Mutual Information Proxy Scanner
type: FRAMEWORK
agent_parameter_tuning_guide:
  - parameter: "k"
    default: 3
    impact: "Number of nearest neighbors for KSG mutual information estimation. Higher values (5-10) reduce variance but increase bias for small datasets. Lower values (1-2) are more sensitive but noisier. Use 3 for datasets > 1,000 rows. Use 5-7 for datasets > 10,000 rows. Never set k > sqrt(n_samples)."
  - parameter: "n_perms"
    default: 200
    impact: "Number of null permutations for significance testing. More permutations give more precise p-values but increase computation linearly. Use 100 for quick exploratory scans. Use 500 for publication-grade audits. For datasets > 50,000 rows, keep at 100 to avoid sandbox timeouts."
  - parameter: "alpha"
    default: 0.05
    impact: "Benjamini-Hochberg FDR significance threshold. Controls the expected false discovery rate. Use 0.05 for standard audits. Increase to 0.10 for smaller datasets where fewer discoveries are expected. Decrease to 0.01 for conservative, high-stakes audits."
  - parameter: "mi_floor"
    default: 0.01
    impact: "Minimum observed MI value to consider a feature as a potential proxy. Features with MI below this floor are excluded even if statistically significant, as the practical dependence is negligible. Increase to 0.05 for stricter filtering."
pipeline_dag:
  - step_id: 1
    name: "Compute Observed Mutual Information"
    sub_skill: "ksg_mutual_information"
    pseudo_code: |
      def compute_observed_mi(X, protected_attr, k=3):
          """
          Compute the mutual information between each feature column and
          the protected attribute using the KSG (k-nearest-neighbor) estimator.

          Args:
              X: np.ndarray, shape (n_samples, n_features). Feature matrix.
              protected_attr: np.ndarray, shape (n_samples,). Protected attribute.
              k: int. Number of nearest neighbors for MI estimation.
          Returns:
              list of float. MI score for each feature.
          """
          from sklearn.feature_selection import mutual_info_classif
          import numpy as np

          # Ensure k does not exceed available samples per class
          unique_classes, class_counts = np.unique(protected_attr, return_counts=True)
          min_class_count = class_counts.min()
          effective_k = min(k, max(1, min_class_count - 1))

          mi_scores = mutual_info_classif(
              X, protected_attr,
              n_neighbors=effective_k,
              random_state=42
          )
          return list(mi_scores)
    constraints: ["X and protected_attr must have identical row counts", "protected_attr must be integer-encoded"]
    output: "observed_mi"
  - step_id: 2
    name: "Significance Testing via Null Permutations"
    sub_skill: "null_permutations"
    depends_on: ["observed_mi"]
    pseudo_code: |
      def null_permutation_testing(X, protected_attr, observed_mi, n_perms=200, k=3):
          """
          Estimate p-values for each feature's MI by comparing against a
          null distribution generated by permuting the protected attribute.

          Args:
              X: np.ndarray, shape (n_samples, n_features).
              protected_attr: np.ndarray, shape (n_samples,).
              observed_mi: list of float. Observed MI scores from step 1.
              n_perms: int. Number of permutation iterations.
              k: int. Same k used in step 1 for consistency.
          Returns:
              list of float. p-value for each feature.
          """
          import numpy as np
          from sklearn.feature_selection import mutual_info_classif

          n_features = X.shape[1]
          observed_mi = np.array(observed_mi)
          exceedance_counts = np.zeros(n_features)

          rng = np.random.RandomState(42)
          for perm_idx in range(n_perms):
              shuffled = rng.permutation(protected_attr.copy())
              perm_mi = mutual_info_classif(X, shuffled, n_neighbors=k, random_state=perm_idx)
              exceedance_counts += (perm_mi >= observed_mi).astype(int)

          # Add 1 to numerator and denominator to avoid p=0
          p_values = (exceedance_counts + 1) / (n_perms + 1)
          return list(p_values)
    constraints: ["n_perms must be >= 50 for reliable p-values", "uses copy of protected_attr to avoid mutation"]
    output: "p_values"
  - step_id: 3
    name: "FDR Correction and Proxy Flagging"
    sub_skill: "fdr_correction"
    depends_on: ["observed_mi", "p_values"]
    pseudo_code: |
      def fdr_correct_and_flag(observed_mi, p_values, feature_names, alpha=0.05, mi_floor=0.01):
          """
          Apply Benjamini-Hochberg FDR correction to p-values and flag
          features as significant proxies if they pass both the FDR threshold
          and the MI floor.

          Args:
              observed_mi: list of float. MI scores per feature.
              p_values: list of float. Raw p-values per feature.
              feature_names: list of str. Column names. If None, uses indices.
              alpha: float. FDR significance level.
              mi_floor: float. Minimum MI to flag as proxy.
          Returns:
              dict with all results and filtered proxy list.
          """
          from statsmodels.stats.multitest import multipletests

          if not p_values:
              return {"all_features": [], "flagged_proxies": [], "n_proxies": 0}

          reject, p_adj, _, _ = multipletests(p_values, alpha=alpha, method='fdr_bh')

          all_features = []
          flagged_proxies = []
          for i in range(len(p_adj)):
              name = feature_names[i] if feature_names else f"feature_{i}"
              entry = {
                  "feature_name": name,
                  "feature_idx": i,
                  "mi_score": float(observed_mi[i]),
                  "p_value_raw": float(p_values[i]),
                  "p_value_adjusted": float(p_adj[i]),
                  "is_significant": bool(reject[i]),
                  "is_proxy": bool(reject[i] and observed_mi[i] > mi_floor)
              }
              all_features.append(entry)
              if entry["is_proxy"]:
                  flagged_proxies.append(entry)

          return {
              "all_features": sorted(all_features, key=lambda x: x["mi_score"], reverse=True),
              "flagged_proxies": sorted(flagged_proxies, key=lambda x: x["mi_score"], reverse=True),
              "n_proxies": len(flagged_proxies),
              "alpha_used": alpha,
              "mi_floor_used": mi_floor
          }
    constraints: ["requires statsmodels package", "p_values and observed_mi must have same length"]
    output: "proxy_report"
  - step_id: 4
    name: "Conditional Residualization of Flagged Proxies"
    sub_skill: "residualize"
    depends_on: ["proxy_report"]
    pseudo_code: |
      def residualize_proxies(X, protected_attr, proxy_report, feature_names):
          """
          Remove the protected attribute's influence from flagged proxy features
          by replacing each with its regression residual, preserving original variance.

          Args:
              X: np.ndarray, shape (n_samples, n_features). Original feature matrix.
              protected_attr: np.ndarray, shape (n_samples,). Protected attribute.
              proxy_report: dict from step 3. Contains flagged_proxies list.
              feature_names: list of str. Column names.
          Returns:
              dict with cleaned feature matrix and mitigation metadata.
          """
          import numpy as np
          from sklearn.linear_model import Ridge

          flagged = proxy_report["flagged_proxies"]
          if not flagged:
              return {
                  "X_clean": X,
                  "n_mitigated": 0,
                  "mitigated_features": [],
                  "action": "no_proxies_to_mitigate"
              }

          X_clean = X.copy().astype(float)
          mitigated_features = []

          for proxy in flagged:
              idx = proxy["feature_idx"]
              feat = X_clean[:, idx]

              # Fit Ridge regression predicting feature from protected attribute
              model = Ridge(alpha=1.0).fit(protected_attr.reshape(-1, 1), feat)
              predicted = model.predict(protected_attr.reshape(-1, 1))
              residual = feat - predicted

              # Restore original variance to prevent downstream scale distortion
              orig_std = np.std(feat)
              res_std = np.std(residual)
              if res_std > 1e-9:
                  residual = residual * (orig_std / res_std)

              X_clean[:, idx] = residual
              mitigated_features.append(proxy["feature_name"])

          return {
              "X_clean": X_clean,
              "n_mitigated": len(mitigated_features),
              "mitigated_features": mitigated_features,
              "action": "residualized"
          }
    constraints: ["protected_attr must be numeric for Ridge regression", "original variance is preserved after residualization"]
    output: "final_result"
orchestration_pattern: "sequential_with_conditional_skip"
sandbox_requirements: ["numpy", "scikit-learn", "statsmodels"]
failure_handling: "return_partial_state_on_timeout"
