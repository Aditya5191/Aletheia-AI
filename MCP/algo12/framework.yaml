algorithm_id: 12
name: Fairness Feedback Loops and Algorithmic Reparation (MIDS + STAR)
type: FRAMEWORK
agent_parameter_tuning_guide:
  - parameter: "n_generations"
    default: 10
    impact: "Number of model generations to simulate. Use 5 for quick audits; increase to 40 for deep collapse detection. Datasets < 1,000 rows should stay <= 10 to avoid noise domination."
  - parameter: "positive_class"
    default: 1
    impact: "Label value representing the favorable outcome. Must match dataset encoding exactly or all metric computations will invert."
  - parameter: "batch_size"
    default: 64
    impact: "STAR training batch size. Scale proportionally to dataset size. For datasets > 50,000 rows use 256-512. Too small causes quota starvation."
  - parameter: "reparation_budget"
    default: 16
    impact: "Extra pool samples drawn beyond batch_size to fill intersectional quotas. Increase to batch_size * 0.5 if minoritized groups are severely underrepresented."
  - parameter: "n_label_classes"
    default: 2
    impact: "Number of distinct outcome labels. Binary classification uses 2. Multi-class datasets must set this to the actual class count or strata mapping breaks."
  - parameter: "n_sens_groups"
    default: 2
    impact: "Number of distinct sensitive attribute groups. Must match the actual cardinality of the sensitive column. Undercount causes silent strata collapse."
  - parameter: "fairness_ideal"
    default: "uniform"
    impact: "Strata distribution target. 'uniform' enforces equal representation. Future versions may support domain-specific ideals."
  - parameter: "kl_epsilon"
    default: 1e-10
    impact: "Epsilon clipping for KL-divergence to prevent log(0). Do not change unless encountering numerical overflow on extremely sparse strata."
pipeline_dag:
  - step_id: 1
    name: "Compute Demographic Parity Difference"
    sub_skill: "demographic_parity"
    pseudo_code: |
      def compute_demographic_parity_diff(predictions, sensitive_attr, positive_class=1):
          """
          Compute the maximum difference in positive prediction rates across
          all sensitive attribute groups (Demographic Parity Difference).

          Args:
              predictions: np.ndarray, shape (n_samples,). Model predictions.
              sensitive_attr: np.ndarray, shape (n_samples,). Sensitive attribute.
              positive_class: int. Label value representing favorable outcome.
          Returns:
              float. Max difference in positive prediction rates across groups.
          """
          import numpy as np
          groups = np.unique(sensitive_attr)
          rates = []
          for g in groups:
              mask = sensitive_attr == g
              if np.sum(mask) == 0:
                  rates.append(np.nan)
              else:
                  rates.append(np.mean(predictions[mask] == positive_class))
          if np.all(np.isnan(rates)):
              return np.nan
          return float(np.nanmax(rates) - np.nanmin(rates))
    constraints: ["predictions and sensitive_attr must have identical length"]
    output: "dp_diff"
  - step_id: 2
    name: "Compute Equalized Odds Difference"
    sub_skill: "equalized_odds"
    pseudo_code: |
      def compute_equalized_odds_diff(y_true, predictions, sensitive_attr, positive_class=1):
          """
          Compute the maximum difference in TPR and FPR across sensitive
          attribute groups. Returns the larger of the two differences.

          Args:
              y_true: np.ndarray, shape (n_samples,). Ground truth labels.
              predictions: np.ndarray, shape (n_samples,). Model predictions.
              sensitive_attr: np.ndarray, shape (n_samples,). Sensitive attribute.
              positive_class: int. Favorable outcome label.
          Returns:
              float. Max of (TPR difference, FPR difference) across groups.
          """
          import numpy as np
          from sklearn.metrics import confusion_matrix
          groups = np.unique(sensitive_attr)
          tprs, fprs = [], []
          for g in groups:
              mask = sensitive_attr == g
              tn, fp, fn, tp = confusion_matrix(
                  y_true[mask], predictions[mask], labels=[0, 1]
              ).ravel()
              tpr = tp / (tp + fn) if (tp + fn) > 0 else np.nan
              fpr = fp / (fp + tn) if (fp + tn) > 0 else np.nan
              tprs.append(tpr)
              fprs.append(fpr)
          tpr_diff = np.nanmax(tprs) - np.nanmin(tprs) if not np.all(np.isnan(tprs)) else 0.0
          fpr_diff = np.nanmax(fprs) - np.nanmin(fprs) if not np.all(np.isnan(fprs)) else 0.0
          return float(max(tpr_diff, fpr_diff))
    constraints: ["requires binary labels encoded as 0 and 1"]
    output: "eodds_diff"
  - step_id: 3
    name: "Compute Maximum Group Accuracy Gap"
    sub_skill: "accuracy_gap"
    pseudo_code: |
      def compute_max_accuracy_gap(y_true, predictions, sensitive_attr):
          """
          Compute the maximum accuracy gap between any two sensitive
          attribute groups.

          Args:
              y_true: np.ndarray, shape (n_samples,). Ground truth labels.
              predictions: np.ndarray, shape (n_samples,). Model predictions.
              sensitive_attr: np.ndarray, shape (n_samples,). Sensitive attribute.
          Returns:
              float. Max accuracy difference across groups.
          """
          import numpy as np
          groups = np.unique(sensitive_attr)
          accs = []
          for g in groups:
              mask = sensitive_attr == g
              if np.sum(mask) == 0:
                  accs.append(np.nan)
              else:
                  accs.append(np.mean(predictions[mask] == y_true[mask]))
          if np.all(np.isnan(accs)):
              return np.nan
          return float(np.nanmax(accs) - np.nanmin(accs))
    constraints: ["handles empty groups gracefully via NaN propagation"]
    output: "acc_gap"
  - step_id: 4
    name: "Compute Strata KL-Divergence to Fairness Ideal"
    sub_skill: "kl_divergence"
    pseudo_code: |
      def compute_strata_kl_divergence(predictions, sensitive_attr, ideal='uniform', epsilon=1e-10):
          """
          Compute KL-divergence between the actual strata distribution
          (prediction x sensitive group) and the target fairness ideal.

          Args:
              predictions: np.ndarray, shape (n_samples,). Model predictions.
              sensitive_attr: np.ndarray, shape (n_samples,). Sensitive attribute.
              ideal: str. Target distribution. Currently only 'uniform' is supported.
              epsilon: float. Clipping value to prevent log(0).
          Returns:
              float. KL-divergence from actual to ideal strata distribution.
          """
          import numpy as np
          import pandas as pd
          from scipy.stats import entropy

          df = pd.DataFrame({'pred': predictions, 'sens': sensitive_attr})
          strata_counts = df.groupby(['pred', 'sens']).size().reset_index(name='counts')
          total = strata_counts['counts'].sum()

          pred_classes = sorted(np.unique(predictions))
          sens_classes = sorted(np.unique(sensitive_attr))
          n_pred = len(pred_classes)
          n_sens = len(sens_classes)
          n_strata = n_pred * n_sens

          # Build lookup maps for canonical flat indexing
          pred_to_idx = {v: i for i, v in enumerate(pred_classes)}
          sens_to_idx = {v: i for i, v in enumerate(sens_classes)}

          if ideal == 'uniform':
              full_actual = np.full(n_strata, epsilon)
              for _, row in strata_counts.iterrows():
                  flat_idx = pred_to_idx[row['pred']] * n_sens + sens_to_idx[row['sens']]
                  full_actual[flat_idx] = row['counts'] / total
              ideal_dist = np.full(n_strata, 1.0 / n_strata)
          else:
              raise ValueError("Only 'uniform' ideal is currently supported")

          full_actual = np.clip(full_actual, epsilon, None)
          ideal_dist = np.clip(ideal_dist, epsilon, None)
          return float(entropy(full_actual, ideal_dist))
    constraints: ["epsilon must be > 0 to prevent log(0)", "requires scipy"]
    output: "kl_div"
  - step_id: 5
    name: "Track Generational MIDS Metrics"
    sub_skill: "generational_tracker"
    depends_on: ["dp_diff", "eodds_diff", "acc_gap", "kl_div"]
    pseudo_code: |
      def track_generational_mids(models_per_gen, X_test, y_test, sensitive_attr_test, positive_class=1):
          """
          Track fairness metrics across multiple model generations to detect
          Model-Induced Distribution Shifts (MIDS), fairness decay, and
          representation erasure.

          Args:
              models_per_gen: list of fitted sklearn-compatible models, one per generation.
              X_test: np.ndarray, shape (n_samples, n_features). Held-out test features.
              y_test: np.ndarray, shape (n_samples,). Held-out test labels.
              sensitive_attr_test: np.ndarray, shape (n_samples,). Sensitive attribute.
              positive_class: int. Favorable outcome label value.
          Returns:
              pd.DataFrame with columns: generation, accuracy, dp_difference,
              eodds_difference, accuracy_gap, kl_divergence_to_ideal.
          """
          import numpy as np
          import pandas as pd
          history = []
          for i, model in enumerate(models_per_gen):
              preds = model.predict(X_test)
              acc = np.mean(preds == y_test)
              dp = compute_demographic_parity_diff(preds, sensitive_attr_test, positive_class)
              eodds = compute_equalized_odds_diff(y_test, preds, sensitive_attr_test, positive_class)
              gap = compute_max_accuracy_gap(y_test, preds, sensitive_attr_test)
              kl = compute_strata_kl_divergence(preds, sensitive_attr_test)
              history.append({
                  'generation': i,
                  'accuracy': acc,
                  'dp_difference': dp,
                  'eodds_difference': eodds,
                  'accuracy_gap': gap,
                  'kl_divergence_to_ideal': kl
              })
          return pd.DataFrame(history)
    constraints: ["models_per_gen must be a list of fitted sklearn-compatible estimators", "X_test and y_test must match in row count"]
    output: "mids_metrics"
  - step_id: 6
    name: "STAR Reparative Batch Sampling"
    sub_skill: "star_sampler"
    depends_on: ["mids_metrics"]
    pseudo_code: |
      def star_batch_sampler(data_pool, batch_size, reparation_budget, label_col, sensitive_col, n_label_classes=2, n_sens_groups=2, random_state=42):
          """
          STratified Algorithmic Reparation (STAR) batch sampler. Curates training
          batches enforcing intersectional representation quotas across
          label x sensitive-group strata.

          Args:
              data_pool: pd.DataFrame. Full training pool to sample from.
              batch_size: int. Target batch size.
              reparation_budget: int. Extra pool samples beyond batch_size to fill quotas.
              label_col: str. Column name of the outcome label.
              sensitive_col: str. Column name of the sensitive attribute.
              n_label_classes: int. Number of distinct outcome labels.
              n_sens_groups: int. Number of distinct sensitive attribute groups.
              random_state: int. Random seed for reproducibility.
          Returns:
              tuple of (batch DataFrame, strata distribution dict, metadata dict).
          """
          import numpy as np
          import pandas as pd
          rng = np.random.RandomState(random_state)
          n_strata = n_label_classes * n_sens_groups
          ideal_quota = batch_size / n_strata

          pool_size = min(batch_size + reparation_budget, len(data_pool))
          pool = data_pool.sample(n=pool_size, replace=False, random_state=rng)

          selected_indices = []
          strata_counts = np.zeros(n_strata, dtype=int)
          remaining_mask = np.ones(len(pool), dtype=bool)

          def get_stratum_idx(label, sens):
              return int(label * n_sens_groups + sens)

          for idx in range(len(pool)):
              if len(selected_indices) >= batch_size:
                  break
              if not remaining_mask[idx]:
                  continue
              row = pool.iloc[idx]
              stratum = get_stratum_idx(row[label_col], row[sensitive_col])
              if strata_counts[stratum] < ideal_quota:
                  selected_indices.append(idx)
                  strata_counts[stratum] += 1
                  remaining_mask[idx] = False

          remaining_indices = np.where(remaining_mask)[0]
          if len(selected_indices) < batch_size and len(remaining_indices) > 0:
              n_needed = batch_size - len(selected_indices)
              extra = rng.choice(remaining_indices, size=min(n_needed, len(remaining_indices)), replace=False)
              selected_indices.extend(extra.tolist())

          batch = pool.iloc[selected_indices].reset_index(drop=True)
          resampling_rate = 1.0 - (np.sum(strata_counts < ideal_quota) / n_strata)
          actual_dist = strata_counts / max(strata_counts.sum(), 1)
          strata_dist = {
              f"L{l}_S{s}": float(actual_dist[l * n_sens_groups + s])
              for l in range(n_label_classes) for s in range(n_sens_groups)
          }
          return batch, strata_dist, {'resampling_rate': float(resampling_rate), 'selected_count': len(selected_indices)}
    constraints: ["data_pool must contain label_col and sensitive_col", "reparation_budget >= 0", "sample_weights clamped strata quotas"]
    output: "final_result"
orchestration_pattern: "sequential_with_conditional_skip"
sandbox_requirements: ["numpy", "pandas", "scikit-learn", "scipy"]
failure_handling: "return_partial_state_on_timeout"
